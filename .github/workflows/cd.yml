name: CD

on:
  push:
    branches: [main]

env:
  REGISTRY: docker.io
  IMAGE_PREFIX: ${{ secrets.DOCKERHUB_USERNAME }}/streaming-proxy

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.sha_short }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute short SHA tag
        id: meta
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push proxy-server
        uses: docker/build-push-action@v6
        with:
          context: ./proxy-server
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-proxy-server:latest
            ${{ env.IMAGE_PREFIX }}-proxy-server:${{ steps.meta.outputs.sha_short }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./client/backend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-backend:latest
            ${{ env.IMAGE_PREFIX }}-backend:${{ steps.meta.outputs.sha_short }}

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./client/frontend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-frontend:latest
            ${{ env.IMAGE_PREFIX }}-frontend:${{ steps.meta.outputs.sha_short }}

  deploy:
    name: Deploy to Remote Host
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH (pull latest images and restart)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            # Remember the currently running tag so we can roll back if the new one fails health checks.
            docker compose -f docker-compose.prod.yml images backend --format '{{.Tag}}' > .last-known-good-tag || echo "latest" > .last-known-good-tag
            export IMAGE_TAG=${{ needs.build-and-push.outputs.image-tag }}
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

  health-check:
    name: Post-Deploy Health Checks
    needs: [build-and-push, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Verify services are healthy
        env:
          HEALTH_URL: ${{ secrets.DEPLOY_HEALTH_URL }}
        run: |
          for i in $(seq 1 10); do
            if curl -fsS "$HEALTH_URL" > /dev/null; then
              echo "Service healthy."
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "Health check failed after retries."
          exit 1

  rollback:
    name: Rollback on Failure
    needs: [deploy, health-check]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Redeploy previous stable image via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            export IMAGE_TAG=$(cat .last-known-good-tag)
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
