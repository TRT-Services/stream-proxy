name: streaming-proxy

services:
  proxy-server:
    build:
      context: ./proxy-server
    container_name: streaming-proxy-server
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      PROXY_API_KEY: ${PROXY_API_KEY:-change-me-super-secret}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,http://localhost:5173}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:4000/health', r => process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - streaming-net

  backend:
    build:
      context: ./client/backend
    container_name: streaming-backend
    ports:
      - "8080:8080"
    environment:
      PROXY_URL: http://proxy-server:4000
      PROXY_API_KEY: ${PROXY_API_KEY:-change-me-super-secret}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
    depends_on:
      proxy-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - streaming-net

  frontend:
    build:
      context: ./client/frontend
    container_name: streaming-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - streaming-net

networks:
  streaming-net:
    driver: bridge
